name: Android test build

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../wikitree-tree-apps.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wikitree-tree-apps-apk
          path: wikitree-tree-apps.apk

      # On main, replace the APK on the "android-test" release so the download link never changes.
      - name: Publish test release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-test >/dev/null 2>&1 || \
            gh release create android-test --prerelease --title "Android test build" \
              --notes "Latest test build of the Tree Apps shell for Android. Download the APK on your phone and install it."
          gh release upload android-test wikitree-tree-apps.apk --clobber
          gh release edit android-test --notes "Latest test build of the Tree Apps shell for Android (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}). Download the APK on your phone and install it."
