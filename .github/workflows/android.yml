name: Android test build

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", "scripts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "shared/**", "scripts/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          # For the GitHub API call that finds WBE's newest preview build if the locked one is gone.
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../wikitree-tree-apps.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wikitree-tree-apps-apk
          path: wikitree-tree-apps.apk

      # On main, replace the APK on the "android-test" release so the download link never changes.
      - name: Publish test release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-test >/dev/null 2>&1 || \
            gh release create android-test --prerelease --title "Android test build" \
              --notes "Latest test build of the Tree Apps shell for Android. Download the APK on your phone and install it."
          gh release upload android-test wikitree-tree-apps.apk --clobber
          gh release edit android-test --notes "Latest test build of the Tree Apps shell for Android (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}). Download the APK on your phone and install it."

      # A pull request from this repo replaces the APK on the "android-preview" pre-release, so a
      # change can be tried on a phone before it's merged. (Main's build stays on "android-test".)
      - name: Publish preview release
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release view android-preview >/dev/null 2>&1 || \
            gh release create android-preview --prerelease --target "$HEAD" --title "Android preview build" \
              --notes "Test build of a pull request that isn't merged yet."
          gh release upload android-preview wikitree-tree-apps.apk --clobber
          gh release edit android-preview --prerelease --notes "Test build of pull request #$PR (build ${{ github.run_number }}, commit ${HEAD::7}), not merged yet. Download the APK on your phone and install it. It installs over the main test build."
